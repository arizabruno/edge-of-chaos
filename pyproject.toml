[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-of-chaos"
version = "0.1.0"
description = "..."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Bruno Ariza" },
    { name = "Carroll Cannon" },
    { name = "Casper van Bavel" },
    { name = "José Bouza Serrano Dos Santos Costa" }

]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edge_of_chaos"]
